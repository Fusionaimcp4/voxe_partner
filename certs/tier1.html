<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="title" content="Voxe Investor Portal" />
  <meta name="description" content="Voxe - AI-first customer support platform. Investor and partnership materials." />
  <title>Voxe Investor Portal</title>
  <style>
    body { margin: 0; padding: 0; font-family: 'Georgia', serif; background-color: #0f172a; color: white; }
    .certificate {
      width: 900px; height: 750px; margin: 50px auto; padding: 40px;
      border: 20px solid #2563eb; background: #020617;
      box-shadow: 0 0 20px rgba(0,0,0,0.7); position: relative; box-sizing: border-box;
    }
    .certificate:before {
      content: ""; position: absolute; top: 20px; bottom: 20px; left: 20px; right: 20px;
      border: 4px dashed #2563eb; pointer-events: none;
    }
    .certificate h1 { font-size: 48px; color: #2563eb; text-align: center; margin-bottom: 0; }
    .certificate h2 { font-size: 22px; font-weight: normal; color: #94a3b8; text-align: center; margin-top: 5px; }
    .certificate .subtext { text-align: center; margin: 30px 0 10px; font-size: 16px; }
    .certificate .name { text-align: center; font-size: 32px; color: #2563eb; font-family: 'Brush Script MT', cursive; margin: 20px 0; }
    .certificate .ownership { text-align: center; font-size: 18px; color: white; font-weight: bold; }
    .certificate .details { text-align: center; margin-top: 10px; font-size: 14px; color: #94a3b8; }
    .footer-note { font-size: 13px; font-family: 'Georgia', serif; color: #94a3b8; margin-top: 40px; text-align: center; line-height: 1.6; padding: 0 30px; }
    .footer-note a { color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>
  <div class="certificate">
    <h1>Voxe</h1>
    <h2>Investor & Partnership Portal</h2>
    <div class="subtext">AI-first customer support platform</div>
    <div class="details">
      Self-hosted • RAG • helpdesk • workflow • No per-seat fees<br>
      <a href="../index.html">Return to portal</a>
    </div>
    <div class="footer-note">
      Voxe is a product of MCP4. For investment and partnership inquiries, see the <a href="../docs/contact.html">Contact</a> page.
    </div>
  </div>
</body>
</html>
